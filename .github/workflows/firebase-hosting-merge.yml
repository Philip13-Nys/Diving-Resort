name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_API_KEYS: ${{ secrets.CUSTOMER_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAINS: ${{ secrets.CUSTOMER_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_IDS: ${{ secrets.CUSTOMER_FIREBASE_PROJECT_ID }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADMIN_80F41 }}
          channelId: live
          projectId: admin-80f41
